# Manual corrections to romtool's function finder, plus human-readable names.
# section: 0 = main segment (address = vram); N = module N (address = offset into its text).
# Every add_start / merge entry must say why it exists.
#
# [[add_start]]  section = 0  address = 0x80001234  reason = "only reached through a function pointer"
# [[merge]]      section = 12 address = 0x340       reason = "switch case after jr $t6, not a new function"
# [[name]]       section = 0  address = 0x8003F500  name = "game_main"

[[name]]
section = 0
address = 0x80000400
name = "entrypoint"

[[name]]
section = 0
address = 0x80052AB8
name = "module_apply_reloc"

[[name]]
section = 0
address = 0x80053D2C
name = "module_load"

# libultra's hand-written exception/thread assembly (named by n64sym: __osExceptionPreamble, send_mesg, ...). It branches between internal labels across what
# look like function boundaries, uses $k0/$k1 and RCP registers, and is never recompiled: N64ModernRuntime
# replaces the exception and thread machinery. Task 7 checks each of these is named as runtime-handled.

[[exempt]]
section = 0
address = 0x80075020
reason = "libultra exception handler: branches to labels at 0x80075664 / 0x80075760 in later routines"

[[exempt]]
section = 0
address = 0x800755B0
reason = "libultra exception helper (called via jal from the handler) that branches back into it"

# Rare's hand-written floating-point routine at 0x80073E80 calls helpers placed after it (0x800742E8,
# 0x800743D0 — also called from elsewhere) and branches straight into a label inside the second helper
# (0x80073F24 -> 0x8007475C). Recompile it as one function containing its helpers.
[[extend]]
section = 0
address = 0x80073E80
end = 0x80074E50
reason = "asm routine branches into its helper at 0x800743D0; helpers stay callable on their own"

